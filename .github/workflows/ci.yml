name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B package

      - name: Publish coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Publish backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            backend/target/*.jar
            !backend/target/*.jar.original
          retention-days: 14

      # Informational only: dependency-check needs the NVD CVE feed, which is heavily
      # rate-limited without an API key and can be slow/flaky on a fresh cache. Add a repo
      # secret named NVD_API_KEY (see https://nvd.nist.gov/developers/request-an-api-key)
      # to speed it up; until then this still runs, just slower, and never blocks the merge.
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: >
          mvn -B org.owasp:dependency-check-maven:9.2.0:check
          -DfailBuildOnCVSS=9
          -Dformat=HTML
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Publish dependency scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Publish frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

      # Informational only: the current lockfile has 5 known advisories, all transitive
      # dev-tooling deps of Vitest/esbuild's dev server (never shipped to production, only
      # reachable if you run `vite`/`vitest` on an untrusted network). Fixing them requires
      # `npm audit fix --force`, a breaking Vite 5 -> 8 jump - deliberately not done silently.
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: npm audit

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Require both lanes to have passed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "backend: ${{ needs.backend.result }}, frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
          echo "backend and frontend both passed."
