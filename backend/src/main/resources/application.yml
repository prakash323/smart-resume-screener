server:
  port: 8080

spring:
  application:
    name: resume-screener
  datasource:
    url: jdbc:h2:file:./data/resumescreener
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  default-model: ${OPENROUTER_DEFAULT_MODEL:openai/gpt-4o-mini}
  timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.unthinkable.resumescreener: INFO
