spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

openrouter:
  api-key: test-key
  base-url: http://localhost:0
  default-model: openai/gpt-4o-mini
  timeout-seconds: 5

app:
  cors:
    allowed-origin: http://localhost:5173
